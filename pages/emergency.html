<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
    <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="theme-icon" aria-hidden="true"></span></button>
</nav>

<header>
    <h1>Emergency Support</h1>
    <p>You are not alone. Reach out.</p>
</header>

<section class="test-container">

    <div class="question">
        <h2>Trusted Contact</h2>

        <input type="text" id="contactName" placeholder="Enter contact name">

        <input type="tel" id="contactNumber" placeholder="Enter contact number">

        <button onclick="saveEmergencyContact()">Save Contact</button>
    </div>

    <div class="question">
        <h2>Your Saved Contact</h2>

        <p id="savedContact"></p>

        <a id="callButton" href="#">Call Now</a>
    </div>

    <div class="question">
        <h2>Mental Health Helpline</h2>

        <p>National Mental Health Helpline (India)</p>
        <p>📞 14416</p>
    </div>

</section>

<script src="../script.js"></script>
</body>
</html>
