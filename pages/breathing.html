<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Exercise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
    <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="theme-icon" aria-hidden="true"></span></button>
</nav>

<main class="breathing-page">
    <section class="breathing-shell">
        <div class="breathing-copy">
            <span class="eyebrow">Guided Breathwork</span>
            <h1>Find your steady rhythm</h1>
            <p>Follow the circle as it expands, holds, and releases through a calming 60 second session.</p>
        </div>

        <div class="preset-panel" aria-label="Breathing modes">
            <label class="preset-chip">
                <input type="radio" name="breathingMode" value="relax" checked>
                <span>Relax</span>
                <small>4-4-4</small>
            </label>
            <label class="preset-chip">
                <input type="radio" name="breathingMode" value="calm">
                <span>Calm</span>
                <small>4-7-8</small>
            </label>
            <label class="preset-chip">
                <input type="radio" name="breathingMode" value="focus">
                <span>Focus</span>
                <small>Box</small>
            </label>
        </div>

        <section class="breathing-container" aria-label="Breathing animation">
            <div class="breath-orbit" aria-hidden="true"></div>
            <div class="breath-orbit orbit-two" aria-hidden="true"></div>

            <div class="circle" id="circle">
                <p id="breathText">Ready</p>
                <span>Follow the pulse</span>
            </div>
        </section>

        <div class="breath-progress" aria-hidden="true">
            <span></span>
        </div>

        <div class="session-stats">
            <div class="timer-card">
                <small>Time remaining</small>
                <h2 id="timer">60 sec</h2>
            </div>
            <div class="timer-card">
                <small>Total duration</small>
                <h2>60 sec</h2>
            </div>
        </div>

        <div class="controls">
            <button onclick="startBreathingSession()">Start session</button>
            <button onclick="stopBreathingSession()">Stop session</button>
            <button onclick="resetBreathingSession()">Reset session</button>
        </div>
    </section>
</main>

<script src="../script.js"></script>
</body>
</html>
