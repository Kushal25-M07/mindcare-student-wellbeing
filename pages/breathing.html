<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Exercise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
    <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="theme-icon" aria-hidden="true"></span></button>
</nav>

<header>
    <h1>Breathing Exercise</h1>
    <p>Relax your mind with guided breathing</p>
</header>

<section class="breathing-container">

    <div class="circle" id="circle">
        <p id="breathText">Ready</p>
    </div>

</section>

<div class="controls">
    <h2 id="timer">60 sec</h2>

    <button onclick="startBreathingSession()">Start</button>
    <button onclick="stopBreathingSession()">Stop</button>
</div>

</section>

<script src="../script.js"></script>
</body>
</html>
