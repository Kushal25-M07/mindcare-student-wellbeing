<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
        <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="theme-icon" aria-hidden="true"></span></button>
    </nav>

<main class="chatbot-page">
    <section class="chatbot-shell">
        <div class="chatbot-header">
            <span class="eyebrow">MindCare Chat</span>
            <h1>Support Chatbot</h1>
            <p>Share what is on your mind. I will respond with gentle, practical support.</p>
        </div>

        <div class="quick-replies" aria-label="Quick replies">
            <button type="button" onclick="useQuickReply('I feel stressed')">I feel stressed</button>
            <button type="button" onclick="useQuickReply('Exam anxiety')">Exam anxiety</button>
            <button type="button" onclick="useQuickReply('Feeling sad')">Feeling sad</button>
            <button type="button" onclick="useQuickReply('Need motivation')">Need motivation</button>
        </div>

        <div id="chatBox" class="chat-box" aria-live="polite">
            <div class="message-row bot">
                <div class="message-bubble">
                    <p>Hello. How are you feeling today?</p>
                    <time>Now</time>
                </div>
            </div>
        </div>
    </section>

    <div class="chat-composer">
        <input type="text" id="userInput" placeholder="Type your feelings here...">
        <button onclick="sendMessage()">Send</button>
    </div>
</main>

<script src="../script.js"></script>
</body>
</html>
