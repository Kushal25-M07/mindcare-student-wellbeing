<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
        <button class="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode"><span class="theme-icon" aria-hidden="true"></span></button>
    </nav>

<header>
    <h1>MindCare Support Chatbot</h1>
    <p>Talk about how you feel</p>
</header>

<section class="test-container">

    <div id="chatBox" class="chat-box"></div>

    <input type="text" id="userInput" placeholder="Type your feelings here...">

    <button onclick="sendMessage()">Send</button>

</section>

<script src="../script.js"></script>
</body>
</html>
